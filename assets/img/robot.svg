<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none" role="img" aria-label="Humanoider Roboter Unitree G1">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#b8c4e0"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e4e7"/>
      <stop offset="1" stop-color="#9a9aa2"/>
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d4d4d8"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </radialGradient>
  </defs>
  <!-- Head -->
  <rect x="112" y="20" width="76" height="66" rx="24" fill="url(#body)"/>
  <rect x="124" y="36" width="52" height="30" rx="14" fill="url(#visor)"/>
  <circle cx="140" cy="51" r="5" fill="#0a0e1a"/>
  <circle cx="160" cy="51" r="5" fill="#0a0e1a"/>
  <rect x="140" y="8" width="20" height="16" rx="6" fill="url(#joint)"/>
  <!-- Neck -->
  <rect x="138" y="82" width="24" height="14" rx="6" fill="url(#joint)"/>
  <!-- Torso -->
  <rect x="98" y="94" width="104" height="120" rx="30" fill="url(#body)"/>
  <circle cx="150" cy="140" r="22" fill="url(#joint)"/>
  <circle cx="150" cy="140" r="11" fill="#0a0e1a" opacity="0.85"/>
  <rect x="118" y="180" width="64" height="10" rx="5" fill="#9fb0d0"/>
  <rect x="118" y="196" width="44" height="8" rx="4" fill="#9fb0d0"/>
  <!-- Shoulders / Arms -->
  <circle cx="98" cy="108" r="18" fill="url(#joint)"/>
  <circle cx="202" cy="108" r="18" fill="url(#joint)"/>
  <rect x="70" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
  <rect x="208" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
  <circle cx="81" cy="196" r="13" fill="url(#joint)"/>
  <circle cx="219" cy="196" r="13" fill="url(#joint)"/>
  <rect x="72" y="204" width="18" height="46" rx="9" fill="url(#body)"/>
  <rect x="210" y="204" width="18" height="46" rx="9" fill="url(#body)"/>
  <!-- Pelvis -->
  <rect x="112" y="214" width="76" height="34" rx="16" fill="url(#joint)"/>
  <!-- Legs -->
  <circle cx="130" cy="252" r="16" fill="url(#body)"/>
  <circle cx="170" cy="252" r="16" fill="url(#body)"/>
  <rect x="120" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
  <rect x="160" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
  <circle cx="130" cy="322" r="13" fill="url(#joint)"/>
  <circle cx="170" cy="322" r="13" fill="url(#joint)"/>
  <rect x="118" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
  <rect x="158" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
  <rect x="110" y="374" width="42" height="14" rx="7" fill="url(#joint)"/>
  <rect x="150" y="374" width="42" height="14" rx="7" fill="url(#joint)"/>
</svg>
