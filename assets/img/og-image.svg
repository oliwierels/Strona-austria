<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9cf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f4"/>
      <stop offset="1" stop-color="#c4c4cc"/>
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d4d4d8"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#26262b" stroke-width="1"/>

  <!-- Logo mark -->
  <rect x="80" y="72" width="60" height="60" rx="14" fill="#0b0b0d" stroke="#2b2b30"/>
  <text x="110" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="url(#gold)" text-anchor="middle">33</text>
  <text x="158" y="115" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#f5f5f6">33bots</text>

  <!-- Headline -->
  <text x="80" y="288" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="#f5f5f6" letter-spacing="-2">Roboter mieten</text>
  <text x="80" y="370" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#gold)" letter-spacing="-2">für Events in Österreich</text>
  <text x="80" y="444" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#a3a3ab">Unitree G1 · inkl. Operator, Transport &amp; Branding</text>

  <!-- Pills -->
  <rect x="80" y="492" width="230" height="52" rx="26" fill="#101013" stroke="#26262b"/>
  <text x="195" y="525" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#f5f5f6" text-anchor="middle">132 cm · 43 Achsen</text>
  <rect x="326" y="492" width="230" height="52" rx="26" fill="#101013" stroke="#26262b"/>
  <text x="441" y="525" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#f5f5f6" text-anchor="middle">ganz Österreich</text>

  <!-- Robot -->
  <g transform="translate(880, 150) scale(0.9)">
    <rect x="112" y="20" width="76" height="66" rx="24" fill="url(#body)"/>
    <rect x="124" y="36" width="52" height="30" rx="14" fill="url(#visor)"/>
    <circle cx="140" cy="51" r="5" fill="#0a0a0a"/>
    <circle cx="160" cy="51" r="5" fill="#0a0a0a"/>
    <rect x="140" y="8" width="20" height="16" rx="6" fill="url(#gold)"/>
    <rect x="138" y="82" width="24" height="14" rx="6" fill="url(#gold)"/>
    <rect x="98" y="94" width="104" height="120" rx="30" fill="url(#body)"/>
    <circle cx="150" cy="140" r="22" fill="url(#gold)"/>
    <circle cx="150" cy="140" r="11" fill="#0a0a0a" opacity="0.85"/>
    <circle cx="98" cy="108" r="18" fill="url(#gold)"/>
    <circle cx="202" cy="108" r="18" fill="url(#gold)"/>
    <rect x="70" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
    <rect x="208" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
    <rect x="112" y="214" width="76" height="34" rx="16" fill="url(#gold)"/>
    <rect x="120" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
    <rect x="160" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
    <rect x="118" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
    <rect x="158" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
  </g>
</svg>
