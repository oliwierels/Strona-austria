<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2fb"/>
      <stop offset="1" stop-color="#b8c4e0"/>
    </linearGradient>
    <radialGradient id="visor" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#22d3aa"/>
      <stop offset="1" stop-color="#0a3d33"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="72" width="64" height="64" rx="16" fill="url(#brand)"/>
  <text x="112" y="118" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">33</text>
  <text x="162" y="118" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#eef2fb">33bots</text>

  <!-- Headline -->
  <text x="80" y="290" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="#eef2fb" letter-spacing="-2">Roboter mieten</text>
  <text x="80" y="372" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="url(#brand)" letter-spacing="-2">für Events in Österreich</text>
  <text x="80" y="446" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600" fill="#9fb0d0">Unitree G1 · inkl. Operator, Transport &amp; Branding</text>

  <!-- Pills -->
  <rect x="80" y="492" width="220" height="52" rx="26" fill="#141d33" stroke="#24304f"/>
  <text x="190" y="525" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#22d3aa" text-anchor="middle">132 cm · 43 Achsen</text>
  <rect x="316" y="492" width="240" height="52" rx="26" fill="#141d33" stroke="#24304f"/>
  <text x="436" y="525" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#4f7cff" text-anchor="middle">ganz Österreich</text>

  <!-- Robot -->
  <g transform="translate(880, 150) scale(0.9)">
    <rect x="112" y="20" width="76" height="66" rx="24" fill="url(#body)"/>
    <rect x="124" y="36" width="52" height="30" rx="14" fill="url(#visor)"/>
    <circle cx="140" cy="51" r="5" fill="#0a0e1a"/>
    <circle cx="160" cy="51" r="5" fill="#0a0e1a"/>
    <rect x="140" y="8" width="20" height="16" rx="6" fill="url(#brand)"/>
    <rect x="138" y="82" width="24" height="14" rx="6" fill="url(#brand)"/>
    <rect x="98" y="94" width="104" height="120" rx="30" fill="url(#body)"/>
    <circle cx="150" cy="140" r="22" fill="url(#brand)"/>
    <circle cx="150" cy="140" r="11" fill="#0a0e1a" opacity="0.85"/>
    <circle cx="98" cy="108" r="18" fill="url(#brand)"/>
    <circle cx="202" cy="108" r="18" fill="url(#brand)"/>
    <rect x="70" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
    <rect x="208" y="112" width="22" height="80" rx="11" fill="url(#body)"/>
    <rect x="112" y="214" width="76" height="34" rx="16" fill="url(#brand)"/>
    <rect x="120" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
    <rect x="160" y="256" width="20" height="66" rx="10" fill="url(#body)"/>
    <rect x="118" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
    <rect x="158" y="326" width="24" height="60" rx="10" fill="url(#body)"/>
  </g>
</svg>
