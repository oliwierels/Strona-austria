name: Wdrożenie na 33bots.at

# 33bots.at publikowało się przez GitHub Pages — tyle że domena wskazuje na zwykły hosting
# (odpowiada LiteSpeed, nie GitHub), więc te publikacje nigdzie nie docierały. Pod adresem
# leżała wersja wgrana kiedyś ręcznie, a przebiegi kończyły się na zielono, bo nikt nie
# sprawdzał, co naprawdę serwuje domena.
#
# Od teraz Austria idzie tym samym torem co 33bots.pl, 33bots.lt i 33bots.de: bramka
# sprawdza stronę, a potem serwer sam sięga po zmiany przez narzedzia-serwer/deploy.php.
# Gdy strona nie przejdzie sprawdzenia, wdrożenia nie ma i na serwerze zostaje poprzednia
# wersja. Publikacja na Pages zostaje jako ścieżka zapasowa, wyłączona domyślnie.
#
# PRZEŁĄCZENIE NA PUBLIKACJĘ PRZEZ ACTIONS — dwa kroki, oba jednorazowe:
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Secrets and variables → Actions → Variables → PAGES_PRZEZ_ACTIONS = tak
#
# Dopóki zmiennej nie ma, workflow wyłącznie sprawdza stronę, a publikuje dotychczasowy
# mechanizm gałęziowy. Dzięki temu scalenie niczego nie psuje i nie zostawia czerwonych
# przebiegów: krok publikacji po prostu się nie uruchamia.
on:
  push:
    branches: [claude/session-p10snn]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: wdrozenie-produkcja-at
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sprawdz:
    name: Sprawdź stronę
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Bramka przed publikacją
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          DOMENA = 'https://33bots.at'
          OBCE_DOMENY = ('https://33bots.pl', 'https://33bots.lt', 'https://33bots.de')

          STRONY = sorted(p for p in os.listdir('.') if p.endswith('.html'))
          bledy = []

          PUSTE = {'meta','link','img','br','input','source','hr','iframe',
                   'path','circle','rect','polyline','line','polygon','use','stop','col'}

          class Kontrola(HTMLParser):
              def __init__(self, plik):
                  super().__init__(); self.stos = []; self.plik = plik
              def handle_starttag(self, tag, attrs):
                  if tag in ('svg', 'iframe'): return
                  if tag not in PUSTE: self.stos.append(tag)
              def handle_endtag(self, tag):
                  if tag in PUSTE or tag == 'svg': return
                  if self.stos and self.stos[-1] == tag: self.stos.pop()
                  elif tag in self.stos:
                      while self.stos and self.stos[-1] != tag:
                          bledy.append(f'{self.plik}: niezamknięty <{self.stos.pop()}>')
                      self.stos.pop()
                  else:
                      bledy.append(f'{self.plik}: zbłąkany </{tag}>')

          if 'index.html' not in STRONY:
              bledy.append('brak index.html — nie ma czego publikować')

          # Bez tego pliku GitHub Pages przestaje serwować stronę pod własną domeną
          # i 33bots.at przestaje działać.
          if not os.path.exists('CNAME') or open('CNAME', encoding='utf-8').read().strip() != '33bots.at':
              bledy.append('CNAME musi zawierać dokładnie 33bots.at — inaczej Pages zgubi domenę')

          kanoniczne = {}

          for plik in STRONY:
              zrodlo = open(plik, encoding='utf-8').read()
              bez_kanonicznego = plik in ('404.html', 'danke.html')

              k = Kontrola(plik); k.feed(zrodlo)
              if k.stos: bledy.append(f'{plik}: niezamknięte znaczniki: {k.stos}')

              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>', zrodlo, re.S):
                  try: json.loads(m.group(1))
                  except Exception as e: bledy.append(f'{plik}: błędny JSON-LD: {e}')

              m = re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"', zrodlo)
              if not m:
                  if not bez_kanonicznego:
                      bledy.append(f'{plik}: brak adresu kanonicznego')
              elif not m.group(1).startswith(DOMENA):
                  bledy.append(f'{plik}: adres kanoniczny spoza {DOMENA}: {m.group(1)}')
              else:
                  kanoniczne.setdefault(m.group(1), []).append(plik)

              # hreflang: obca wersja językowa nie może wskazywać na własną domenę.
              for lang, href in re.findall(r'hreflang="([^"]+)" href="([^"]+)"', zrodlo):
                  if lang not in ('de-AT', 'x-default') and href.startswith(DOMENA):
                      bledy.append(f'{plik}: hreflang="{lang}" wskazuje na {href} zamiast na obcą wersję językową')

              for m in re.finditer(r'(?:src|href)="([^"#?:]+\.(?:webp|jpg|jpeg|png|svg|css|js|ico|woff2|mp4|html|xml|txt))(?:[?#][^"]*)?"', zrodlo):
                  if not os.path.exists(m.group(1)):
                      bledy.append(f'{plik}: odwołanie do nieistniejącego pliku {m.group(1)}')

          for adres, pliki in kanoniczne.items():
              if len(pliki) > 1:
                  bledy.append(f'ten sam adres kanoniczny {adres} na stronach: {", ".join(pliki)}')

          import xml.etree.ElementTree as ET
          try:
              drzewo = ET.parse('sitemap.xml')
          except Exception as e:
              drzewo = None
              bledy.append(f'sitemap.xml: błędny XML: {e}')

          if drzewo is not None:
              NS = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
              adresy = [w.text.strip() for w in drzewo.getroot().iter(NS + 'loc') if w.text]
              if not adresy:
                  bledy.append('sitemap.xml: brak adresów')
              for adres in adresy:
                  if not adres.startswith(DOMENA):
                      bledy.append(f'sitemap.xml: adres spoza {DOMENA}: {adres}')
                      continue
                  sciezka = urlparse(adres).path.lstrip('/') or 'index.html'
                  if not os.path.exists(sciezka):
                      bledy.append(f'sitemap.xml: adres {adres} nie ma pliku {sciezka}')

          if bledy:
              print('PUBLIKACJA WSTRZYMANA — strona zostaje w poprzedniej wersji:')
              for b in bledy: print('  -', b)
              sys.exit(1)

          print(f'Sprawdzone strony: {len(STRONY)}')
          print('Struktura, dane strukturalne, adresy kanoniczne, hreflang, CNAME i mapa strony w porządku.')
          PY

      - name: Audyt SEO (31 kryteriów)
        run: python3 audit.py . 33bots.at

      - name: Poproś serwer o pobranie zmian
        env:
          ADRES: ${{ secrets.DEPLOY_URL_AT }}
          TOKEN: ${{ secrets.DEPLOY_TOKEN_AT }}
        run: |
          if [ -z "${ADRES:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Brak sekretu DEPLOY_URL_AT lub DEPLOY_TOKEN_AT."
            echo ""
            echo "Dopóki ich nie ma, nic nie trafia na 33bots.at — domena stoi na"
            echo "zwykłym hostingu, a nie na GitHub Pages. Do uruchomienia potrzeba:"
            echo "  1. wgrać narzedzia-serwer/deploy.php do katalogu ze stroną 33bots.at,"
            echo "     wpisując w nim własny token w stałej TOKEN,"
            echo "  2. ustawić sekrety DEPLOY_URL_AT (adres do deploy.php) i DEPLOY_TOKEN_AT"
            echo "     (ten sam token) w Settings -> Secrets and variables -> Actions."
            echo ""
            echo "Szczegóły: WDROZENIE.md"
            exit 1
          fi

          KOD=$(curl -sS --max-time 600 --retry 2 --retry-delay 5 \
                     -o /tmp/odpowiedz.txt -w '%{http_code}' \
                     --data-urlencode "token=${TOKEN}" "${ADRES}") || true

          echo "── Odpowiedź serwera (HTTP ${KOD}) ──"
          if [ "${KOD}" = "200" ]; then
            cat /tmp/odpowiedz.txt
          else
            head -c 600 /tmp/odpowiedz.txt
          fi
          echo ""

          if [ "${KOD}" != "200" ]; then
            case "${KOD}" in
              404) echo "Pod adresem z sekretu DEPLOY_URL_AT nie ma pliku deploy.php."
                   echo "Wgraj go do katalogu, w którym leży index.html strony 33bots.at." ;;
              403) echo "Serwer odrzucił token: ten w deploy.php różni się od sekretu DEPLOY_TOKEN_AT." ;;
              500) echo "deploy.php zgłosił błąd — placeholder zamiast tokenu albo brak ZipArchive." ;;
              502) echo "Serwer nie dosięgnął GitHuba — sprawdź ruch wychodzący hostingu." ;;
              000) echo "Brak odpowiedzi: zły adres, brak certyfikatu albo hosting nie odpowiada." ;;
              *)   echo "Nieoczekiwany kod odpowiedzi — treść odpowiedzi jest wyżej." ;;
            esac
            echo ""
            echo "Wdrożenie nie powiodło się. Strona zostaje w poprzedniej wersji."
            exit 1
          fi
          if ! grep -q 'WDROŻENIE ZAKOŃCZONE' /tmp/odpowiedz.txt; then
            echo "Serwer odpowiedział, ale nie potwierdził wdrożenia."
            exit 1
          fi

          {
            echo "### Strona zaktualizowana"
            echo ""
            echo '```'
            grep -E 'Zaktualizowane|Bez zmian|Pominięte|Czas' /tmp/odpowiedz.txt || true
            echo '```'
            echo ""
            echo "Commit: \`${GITHUB_SHA::7}\` · https://33bots.at"
          } >> $GITHUB_STEP_SUMMARY

      - name: Sprawdź, co naprawdę serwuje 33bots.at
        run: |
          # Dotąd nic nie potwierdzało, że domena serwuje wersję z repozytorium —
          # jedyne takie sprawdzenie siedziało w zadaniu publikującym, które jest
          # wyłączone. Bez tego „zielony przebieg" nie znaczył, że strona się
          # zaktualizowała. Ten krok sprawdza to niezależnie od sposobu publikacji.
          KOD=$(curl -sS -o /tmp/strona.html -D /tmp/naglowki.txt -w '%{http_code}' \
                     --max-time 30 -L -H 'Cache-Control: no-cache' \
                     https://33bots.at/ || echo 000)
          echo "https://33bots.at → HTTP ${KOD}"
          echo "Serwer: $(grep -i '^server:' /tmp/naglowki.txt | tail -1 | tr -d '\r' || echo '(brak nagłówka)')"

          if [ "${KOD}" != "200" ]; then
            echo "Domena nie odpowiada kodem 200 — publikacja nie dociera do 33bots.at."
            exit 1
          fi

          W_REPO=$(md5sum index.html | cut -d' ' -f1)
          NA_SERWERZE=$(md5sum /tmp/strona.html | cut -d' ' -f1)
          if [ "${W_REPO}" = "${NA_SERWERZE}" ]; then
            echo "POTWIERDZONE: 33bots.at serwuje wersję z repozytorium."
            echo "33bots.at zgodne z repozytorium — commit \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ROZJAZD: 33bots.at serwuje inną treść strony głównej niż repozytorium."
            echo "W repozytorium: ${W_REPO}"
            echo "Na serwerze:    ${NA_SERWERZE}"
            echo "Jeśli powtórzy się po minucie, publikacja z tej gałęzi nie trafia na domenę."
            {
              echo "### 33bots.at NIE serwuje wersji z repozytorium"
              echo ""
              echo "W repozytorium: \`${W_REPO}\` · na serwerze: \`${NA_SERWERZE}\`"
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Spakuj stronę do publikacji
        if: ${{ vars.PAGES_PRZEZ_ACTIONS == 'tak' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  opublikuj:
    name: Opublikuj na GitHub Pages
    needs: sprawdz
    if: ${{ vars.PAGES_PRZEZ_ACTIONS == 'tak' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.wdrozenie.outputs.page_url }}
    steps:
      - name: Wyślij na Pages
        id: wdrozenie
        uses: actions/deploy-pages@v4

      - name: Potwierdź, że strona odpowiada
        run: |
          KOD=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
                     -H 'Cache-Control: no-cache' https://33bots.at/ || echo 000)
          echo "https://33bots.at → HTTP ${KOD}"
          if [ "${KOD}" != "200" ]; then
            echo "UWAGA: strona nie zwróciła kodu 200 — sprawdź ręcznie."
            exit 1
          fi
          echo "Strona opublikowana — commit \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
